<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #05070e;
    font-family: sans-serif;
    position: relative;
  }

  /* Contêiner das Camadas de Cena */
  .scenes-container {
    position: absolute;
    inset: -60px;
    overflow: hidden;
    z-index: 2;
  }

  /* Camada individual de cada cena */
  .scene-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  .bg-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
    will-change: transform;
    filter: contrast(1.08) saturate(1.15) brightness(0.96);
  }

  /* Degradê atmosférico sutil no topo e base */
  .bg-photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(4, 6, 14, 0.55) 0%,
      rgba(4, 6, 14, 0.15) 15%,
      transparent 25%,
      transparent 75%,
      rgba(4, 6, 14, 0.25) 85%,
      rgba(4, 6, 14, 0.70) 100%
    );
    pointer-events: none;
    z-index: 8;
  }

  /* Vinheta escura cinematográfica nas bordas */
  .vignette-cinematic {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.85), inset 0 0 260px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    z-index: 9;
  }

  /* Partículas cósmicas sutis de fundo */
  .particles-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(147, 197, 253, 0.45) 0%, rgba(147, 197, 253, 0) 70%);
    opacity: 0.25;
    pointer-events: none;
  }
  .p1 { width: 140px; height: 140px; top: 18%; left: 10%; }
  .p2 { width: 180px; height: 180px; top: 55%; right: 8%; }
  .p3 { width: 120px; height: 120px; bottom: 25%; left: 15%; }
</style>
</head>
<body>
  <!-- Contêiner dinâmico de cenas com camadas pré-carregadas -->
  <div id="scenes-container" class="scenes-container"></div>

  <!-- Camadas cinematográficas de overlay e vinheta -->
  <div class="bg-photo-overlay"></div>
  <div class="vignette-cinematic"></div>

  <!-- Partículas cósmicas suaves -->
  <div class="particles-layer">
    <div class="particle p1" id="p1"></div>
    <div class="particle p2" id="p2"></div>
    <div class="particle p3" id="p3"></div>
  </div>

<script>
  let TIMELINE = null;
  const CROSSFADE_MS = 400; // 0.4s de crossfade suave entre trocas de cena

  window.initTimeline = function(data) {
    TIMELINE = data;
    const container = document.getElementById('scenes-container');
    container.innerHTML = '';

    const cenas = data.cenas || [];
    cenas.forEach((cena, i) => {
      const layer = document.createElement('div');
      layer.className = 'scene-layer';
      layer.id = 'scene-layer-' + i;
      layer.style.zIndex = i + 1;
      layer.style.opacity = (i === 0) ? '1' : '0';

      const img = document.createElement('img');
      img.className = 'bg-photo';
      img.id = 'scene-img-' + i;
      if (cena.bg_image) {
        img.src = cena.bg_image;
      }
      layer.appendChild(img);
      container.appendChild(layer);
    });
  };

  window.renderAtTime = function(ms) {
    if (!TIMELINE) return;

    // Movimento suave das partículas
    const p1 = document.getElementById('p1');
    const p2 = document.getElementById('p2');
    const p3 = document.getElementById('p3');
    if (p1) p1.style.transform = `translate(${Math.sin(ms / 2600) * 25}px, ${Math.cos(ms / 2100) * 20}px)`;
    if (p2) p2.style.transform = `translate(${Math.cos(ms / 2800) * 20}px, ${Math.sin(ms / 2400) * 22}px)`;
    if (p3) p3.style.transform = `translate(${Math.sin(ms / 2200) * 18}px, ${Math.cos(ms / 2700) * 18}px)`;

    const cenas = TIMELINE.cenas || [];
    if (cenas.length === 0) return;

    // Localiza a cena ativa para o timestamp ms
    let idx = 0;
    for (let i = 0; i < cenas.length; i++) {
      if (ms >= cenas[i].inicio_ms && ms < cenas[i].fim_ms) {
        idx = i;
        break;
      }
      if (i === cenas.length - 1 && ms >= cenas[i].fim_ms) {
        idx = i;
      }
    }

    const cena = cenas[idx];
    const sceneDur = Math.max(1, cena.fim_ms - cena.inicio_ms);
    const timeInScene = Math.max(0, ms - cena.inicio_ms);
    const t = Math.min(1, Math.max(0, timeInScene / sceneDur));

    // Ken Burns visível e suave em TODAS as cenas (inclusive Cena 1):
    // Alterna zoom-in (1.0 -> 1.12) e zoom-out (1.12 -> 1.0) com leve pan
    const isEven = (idx % 2 === 0);
    const scale = isEven ? (1.00 + (t * 0.12)) : (1.12 - (t * 0.12));
    const panX = isEven ? ((t - 0.5) * 22) : ((t - 0.5) * -22);
    const panY = isEven ? ((t - 0.5) * -16) : ((t - 0.5) * 16);

    const activeImg = document.getElementById('scene-img-' + idx);
    if (activeImg) {
      activeImg.style.transform = `scale(${scale.toFixed(4)}) translate(${panX.toFixed(1)}px, ${panY.toFixed(1)}px)`;
    }

    // Crossfade suave de 0.4s (400ms) nas transições de cena
    const totalCenas = cenas.length;
    for (let j = 0; j < totalCenas; j++) {
      const layerEl = document.getElementById('scene-layer-' + j);
      if (!layerEl) continue;

      if (j === idx) {
        if (idx > 0 && timeInScene < CROSSFADE_MS) {
          // Fade-in da cena atual
          const opacityIn = (timeInScene / CROSSFADE_MS).toFixed(3);
          layerEl.style.opacity = opacityIn;
        } else {
          layerEl.style.opacity = '1';
        }
      } else if (j === idx - 1 && timeInScene < CROSSFADE_MS) {
        // Fade-out da cena anterior
        const opacityOut = (1 - (timeInScene / CROSSFADE_MS)).toFixed(3);
        layerEl.style.opacity = opacityOut;
      } else {
        layerEl.style.opacity = '0';
      }
    }
  };
</script>
</body>
</html>
