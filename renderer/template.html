<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #05070e;
    font-family: sans-serif;
    position: relative;
  }

  /* Imagem 9:16 Tela Cheia 100% Limpa e Cinematográfica */
  .bg-photo-wrap {
    position: absolute;
    inset: -60px;
    overflow: hidden;
    z-index: 2;
  }
  .bg-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
    will-change: transform;
    filter: contrast(1.08) saturate(1.15) brightness(0.96);
  }

  /* Degradê atmosférico sutil no topo e base */
  .bg-photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(4, 6, 14, 0.55) 0%,
      rgba(4, 6, 14, 0.15) 15%,
      transparent 25%,
      transparent 75%,
      rgba(4, 6, 14, 0.25) 85%,
      rgba(4, 6, 14, 0.70) 100%
    );
    pointer-events: none;
    z-index: 3;
  }

  /* Vinheta escura cinematográfica nas bordas */
  .vignette-cinematic {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.85), inset 0 0 260px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    z-index: 4;
  }

  /* Flash ultra sutil de corte entre cenas (40ms) */
  .scene-flash {
    position: absolute;
    inset: 0;
    background: #FFFFFF;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* Partículas cósmicas sutis de fundo */
  .particles-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(147, 197, 253, 0.45) 0%, rgba(147, 197, 253, 0) 70%);
    opacity: 0.25;
    pointer-events: none;
  }
  .p1 { width: 140px; height: 140px; top: 18%; left: 10%; }
  .p2 { width: 180px; height: 180px; top: 55%; right: 8%; }
  .p3 { width: 120px; height: 120px; bottom: 25%; left: 15%; }
</style>
</head>
<body>
  <!-- Foto de fundo em tela cheia com Ken Burns suave -->
  <div id="bg-photo-wrap" class="bg-photo-wrap">
    <img id="bg-photo" class="bg-photo" src="" alt="Cena" />
    <div class="bg-photo-overlay"></div>
    <div class="vignette-cinematic"></div>
  </div>

  <!-- Micro-flash de transição -->
  <div id="scene-flash" class="scene-flash"></div>

  <!-- Partículas cósmicas suaves -->
  <div class="particles-layer">
    <div class="particle p1" id="p1"></div>
    <div class="particle p2" id="p2"></div>
    <div class="particle p3" id="p3"></div>
  </div>

<script>
  let TIMELINE = null;

  window.initTimeline = function(data) {
    TIMELINE = data;
  };

  window.renderAtTime = function(ms) {
    if (!TIMELINE) return;

    // Movimento suave das partículas
    const p1 = document.getElementById('p1');
    const p2 = document.getElementById('p2');
    const p3 = document.getElementById('p3');
    if (p1) p1.style.transform = `translate(${Math.sin(ms / 2600) * 25}px, ${Math.cos(ms / 2100) * 20}px)`;
    if (p2) p2.style.transform = `translate(${Math.cos(ms / 2800) * 20}px, ${Math.sin(ms / 2400) * 22}px)`;
    if (p3) p3.style.transform = `translate(${Math.sin(ms / 2200) * 18}px, ${Math.cos(ms / 2700) * 18}px)`;

    const cenas = TIMELINE.cenas || [];
    if (cenas.length === 0) return;

    let cena = cenas[cenas.length - 1];
    let cenaIndex = cenas.length - 1;
    for (let i = 0; i < cenas.length; i++) {
      if (ms >= cenas[i].inicio_ms && ms < cenas[i].fim_ms) {
        cena = cenas[i];
        cenaIndex = i;
        break;
      }
    }

    if (cena) {
      const sceneDur = Math.max(1, cena.fim_ms - cena.inicio_ms);
      const timeInSceneMs = Math.max(0, ms - cena.inicio_ms);
      const t = Math.min(1, Math.max(0, timeInSceneMs / sceneDur));

      // Micro-flash rápido (60ms) na transição de cena
      const flashEl = document.getElementById('scene-flash');
      if (flashEl) {
        if (timeInSceneMs < 60 && cenaIndex > 0) {
          flashEl.style.opacity = ((1 - (timeInSceneMs / 60)) * 0.25).toFixed(2);
        } else {
          flashEl.style.opacity = '0';
        }
      }

      // Ken Burns alternado elegante (zoom-in / zoom-out)
      const photoImg = document.getElementById('bg-photo');
      if (cena.bg_image) {
        if (photoImg.getAttribute('data-src') !== cena.bg_image) {
          photoImg.setAttribute('data-src', cena.bg_image);
          photoImg.src = cena.bg_image;
        }

        const isEven = (cenaIndex % 2 === 0);
        let scale = isEven ? (1.02 + (t * 0.08)) : (1.10 - (t * 0.08));
        const panDirX = isEven ? 1 : -1;
        const panDirY = isEven ? -1 : 1;
        const panX = Math.sin((cenaIndex * 1.5) + (t * 0.6)) * 16 * panDirX;
        const panY = Math.cos((cenaIndex * 1.1) + (t * 0.5)) * 12 * panDirY;

        photoImg.style.transform = `scale(${scale.toFixed(4)}) translate(${panX.toFixed(1)}px, ${panY.toFixed(1)}px)`;
      }
    }
  };
</script>
</body>
</html>
